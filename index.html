<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SET-HERE for Brass Band</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React ライブラリ -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザ上でJSXを変換するため) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 印刷時の設定 */
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @page { size: landscape; margin: 10mm; }
    }
    /* スマホ・タブレットでのスクロールや選択操作の最適化 */
    html, body { overflow: hidden; height: 100%; width: 100%; touch-action: none; }
  </style>
</head>
<body>
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- アイコン用SVGコンポーネント ---
    const Move = ({className}) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/></svg>);
    const RotateCcw = ({className}) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>);
    const Trash2 = ({className}) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
    const Printer = ({className}) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>);
    const Plus = ({className}) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>);
    const Info = ({className}) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>);

    // --- スケール設定 (1m = 90px に設定) ---
    const PPM = 90; // Pixels Per Meter
    const CHAIR_SIZE = 45; // 0.5m * 90px = 45px

    // --- 配置アイテムのパレット定義 ---
    const CHAIR_STAND_PALETTE = [
      { type: 'chair', label: '椅子', width: CHAIR_SIZE, height: CHAIR_SIZE },
      { type: 'stand', label: '譜面台', width: CHAIR_SIZE, height: CHAIR_SIZE },
      { type: 'conductor_stand', label: '指揮台', width: 60, height: 60 },
    ];

    const PERCUSSION_PALETTE = [
      { type: 'timpani', inch: '32', label: 'Timp 32"', width: 60, height: 60 },
      { type: 'timpani', inch: '29', label: 'Timp 29"', width: 55, height: 55 },
      { type: 'timpani', inch: '26', label: 'Timp 26"', width: 50, height: 50 },
      { type: 'timpani', inch: '23', label: 'Timp 23"', width: 45, height: 45 },
      { type: 'drums', label: 'Drums', width: 108, height: 108 },
      { type: 'mallet', label: 'Marimba', width: 110, height: 45 },
      { type: 'mallet', label: 'Vibraphone', width: 85, height: 35 },
      { type: 'mallet', label: 'Glocken.', width: 60, height: 25 },
      { type: 'cymbals', label: 'Cymbals', width: 45, height: 45 },
      { type: 'tam_tam', label: 'Tam-tam', width: 90, height: 90 },
      { type: 'tubular_bells', label: 'Tubular Bells', width: 90, height: 90 },
      { type: 'bass_drum', label: 'Bass Drum', width: 90, height: 90 },
      { type: 'side_drum', label: 'Side Drum', width: 45, height: 45 },
      { type: 'bongo', label: 'Bongos', width: 45, height: 45 },
      { type: 'conga', label: 'Congas', width: 45, height: 45 },
      { type: 'concert_toms', label: 'Concert Toms', width: 45, height: 45 },
    ];

    // --- 英国式ブラスバンドの標準配置 (12m x 8mステージ用座標に再計算) ---
    const STANDARD_LAYOUT = [
      { id: '1', type: 'conductor_stand', label: '指揮台', x: 520, y: 630, rotation: 0, width: 60, height: 60 },
      // Front Row Cornets
      { id: '2', type: 'chair', label: 'Solo Cnt.', x: 400, y: 580, rotation: 180, width: 45, height: 45 },
      { id: '3', type: 'chair', label: 'Solo Cnt.', x: 400, y: 520, rotation: 180, width: 45, height: 45 },
      { id: '4', type: 'chair', label: 'Solo Cnt.', x: 400, y: 460, rotation: 180, width: 45, height: 45 },
      { id: '5', type: 'chair', label: 'Solo Cnt.', x: 410, y: 400, rotation: 195, width: 45, height: 45 },
      // Back Row Cornets
      { id: '6', type: 'chair', label: 'Sop.', x: 310, y: 580, rotation: 180, width: 45, height: 45 },
      { id: '7', type: 'chair', label: 'Rep.', x: 310, y: 520, rotation: 180, width: 45, height: 45 },
      { id: '8', type: 'chair', label: '2nd Cnt.', x: 310, y: 460, rotation: 180, width: 45, height: 45 },
      { id: '9', type: 'chair', label: '2nd Cnt.', x: 320, y: 400, rotation: 195, width: 45, height: 45 },
      { id: '10', type: 'chair', label: '3rd Cnt.', x: 350, y: 345, rotation: 215, width: 45, height: 45 },
      { id: '10_2', type: 'chair', label: '3rd Cnt.', x: 395, y: 295, rotation: 235, width: 45, height: 45 },
      // Horns & Flugel
      { id: '15', type: 'chair', label: 'Flg.', x: 455, y: 345, rotation: -120, width: 45, height: 45 },
      { id: '16', type: 'chair', label: 'Solo Horn', x: 515, y: 330, rotation: -90, width: 45, height: 45 },
      { id: '17', type: 'chair', label: '1st Horn', x: 575, y: 330, rotation: -90, width: 45, height: 45 },
      { id: '18', type: 'chair', label: '2nd Horn', x: 635, y: 345, rotation: -60, width: 45, height: 45 },
      // Basses
      { id: '22', type: 'chair', label: 'BBb Bass', x: 440, y: 255, rotation: -120, width: 45, height: 45 },
      { id: '23', type: 'chair', label: 'BBb Bass', x: 515, y: 235, rotation: -90, width: 45, height: 45 },
      { id: '24', type: 'chair', label: 'EEb Bass', x: 585, y: 235, rotation: -90, width: 45, height: 45 },
      { id: '25', type: 'chair', label: 'EEb Bass', x: 655, y: 255, rotation: -60, width: 45, height: 45 },
      // Euphoniums & Baritones
      { id: '11', type: 'chair', label: 'Euphonium', x: 680, y: 580, rotation: 0, width: 45, height: 45 },
      { id: '12', type: 'chair', label: 'Euphonium', x: 680, y: 520, rotation: 0, width: 45, height: 45 },
      { id: '13', type: 'chair', label: 'Baritone', x: 680, y: 460, rotation: 0, width: 45, height: 45 },
      { id: '14', type: 'chair', label: 'Baritone', x: 670, y: 400, rotation: -15, width: 45, height: 45 },
      // Trombones
      { id: '19', type: 'chair', label: '1st Trb.', x: 770, y: 580, rotation: 0, width: 45, height: 45 },
      { id: '20', type: 'chair', label: '2nd Trb.', x: 765, y: 460, rotation: -10, width: 45, height: 45 },
      { id: '21', type: 'chair', label: 'Bass Trb.', x: 730, y: 345, rotation: -30, width: 45, height: 45 },
      // Percussion
      { id: '26_1', type: 'timpani', inch: '32', label: 'Timp 32"', x: 170, y: 240, rotation: 0, width: 60, height: 60 },
      { id: '26_2', type: 'timpani', inch: '29', label: 'Timp 29"', x: 235, y: 215, rotation: 0, width: 55, height: 55 },
      { id: '26_3', type: 'timpani', inch: '26', label: 'Timp 26"', x: 295, y: 215, rotation: 0, width: 50, height: 50 },
      { id: '26_4', type: 'timpani', inch: '23', label: 'Timp 23"', x: 350, y: 240, rotation: 0, width: 45, height: 45 },
      { id: '27', type: 'drums', label: 'Drums', x: 790, y: 230, rotation: 0, width: 108, height: 108 },
      { id: '28', type: 'mallet', label: 'Marimba', x: 750, y: 620, rotation: 0, width: 110, height: 45 },
    ];

    // --- メインアプリ ---
    function App() {
      const [items, setItems] = useState([]);
      const [selectedId, setSelectedId] = useState(null);
      const [isPrinting, setIsPrinting] = useState(false);
      const [activeTab, setActiveTab] = useState('stage');
      
      const [stageFrontWidth, setStageFrontWidth] = useState(12.0);
      const [stageBackWidth, setStageBackWidth] = useState(8.0);
      const [stageDepth, setStageDepth] = useState(8.0);
      const [showGrid, setShowGrid] = useState(true);

      const stageRef = useRef(null);
      const dragState = useRef({ isDragging: false, id: null, offsetX: 0, offsetY: 0 });

      useEffect(() => {
        setItems([...STANDARD_LAYOUT]);
      }, []);

      const handleAddItem = (template) => {
        const newItem = {
          ...template,
          id: Date.now().toString(),
          x: (Math.max(stageFrontWidth, stageBackWidth) * PPM) / 2 - 20,
          y: (stageDepth * PPM) / 2 - 20,
          rotation: 0,
        };
        setItems([...items, newItem]);
        setSelectedId(newItem.id);
      };

      const handleClearStage = () => {
        if (window.confirm('ステージをすべてクリアしますか？')) {
          setItems([]);
          setSelectedId(null);
        }
      };

      const handleLoadStandard = () => {
        if (items.length === 0 || window.confirm('現在の配置を破棄して標準配置を読み込みますか？')) {
          setItems([...STANDARD_LAYOUT]);
          setStageFrontWidth(12.0);
          setStageBackWidth(8.0);
          setStageDepth(8.0);
          setSelectedId(null);
        }
      };

      const startDrag = (e, id) => {
        if (isPrinting) return;
        e.stopPropagation();
        setSelectedId(id);
        
        const item = items.find((i) => i.id === id);
        if (!item || !stageRef.current) return;

        const stageRect = stageRef.current.getBoundingClientRect();
        // マウスとタッチ両対応
        const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
        const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);

        dragState.current = {
          isDragging: true,
          id: id,
          offsetX: clientX - stageRect.left - item.x,
          offsetY: clientY - stageRect.top - item.y,
        };
      };

      const onDrag = (e) => {
        if (!dragState.current.isDragging || isPrinting) return;
        
        const stageRect = stageRef.current.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
        const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);

        let newX = clientX - stageRect.left - dragState.current.offsetX;
        let newY = clientY - stageRect.top - dragState.current.offsetY;

        setItems((prev) =>
          prev.map((item) =>
            item.id === dragState.current.id ? { ...item, x: newX, y: newY } : item
          )
        );
      };

      const stopDrag = () => {
        dragState.current.isDragging = false;
      };

      const handleStageClick = () => {
        setSelectedId(null);
      };

      const updateSelectedItem = (key, value) => {
        setItems((prev) =>
          prev.map((item) =>
            item.id === selectedId ? { ...item, [key]: value } : item
          )
        );
      };

      const deleteSelectedItem = () => {
        setItems((prev) => prev.filter((item) => item.id !== selectedId));
        setSelectedId(null);
      };

      const handlePrint = () => {
        setSelectedId(null);
        setIsPrinting(true);
        setTimeout(() => {
          window.print();
          setIsPrinting(false);
        }, 300);
      };

      const selectedItem = items.find((i) => i.id === selectedId);

      const maxWidthPx = Math.max(stageFrontWidth, stageBackWidth) * PPM;
      const depthPx = stageDepth * PPM;
      
      const diffFront = maxWidthPx - (stageFrontWidth * PPM);
      const diffBack = maxWidthPx - (stageBackWidth * PPM);
      const topLeftPct = (diffBack / 2 / maxWidthPx) * 100;
      const topRightPct = 100 - topLeftPct;
      const bottomLeftPct = (diffFront / 2 / maxWidthPx) * 100;
      const bottomRightPct = 100 - bottomLeftPct;
      const clipPathValue = `polygon(${topLeftPct}% 0%, ${topRightPct}% 0%, ${bottomRightPct}% 100%, ${bottomLeftPct}% 100%)`;

      return (
        <div className="flex flex-col h-full bg-gray-50 font-sans text-gray-900">
          {/* ヘッダー */}
          {!isPrinting && (
            <header className="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
              <div>
                <h1 className="text-xl font-bold flex items-center gap-2">
                  <Move className="w-5 h-5" />
                  SET-HERE for Brass Band
                </h1>
                <p className="text-xs text-slate-300 mt-1">実寸スケール(1m=90px)での配置・ステージサイズ調整</p>
              </div>
              <div className="flex gap-3">
                <button
                  onClick={handleLoadStandard}
                  className="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-medium transition flex items-center gap-2"
                >
                  <RotateCcw className="w-4 h-4" />
                  標準配置をロード
                </button>
                <button
                  onClick={handleClearStage}
                  className="px-3 py-2 bg-red-600 hover:bg-red-500 rounded text-sm font-medium transition flex items-center gap-2"
                >
                  <Trash2 className="w-4 h-4" />
                  クリア
                </button>
                <button
                  onClick={handlePrint}
                  className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-medium transition flex items-center gap-2"
                >
                  <Printer className="w-4 h-4" />
                  印刷 / PDF保存
                </button>
              </div>
            </header>
          )}

          {/* メインエリア */}
          <div className="flex flex-1 overflow-hidden relative">
            
            {/* 左サイドバー: アイテムパレット＆設定 */}
            {!isPrinting && (
              <aside className="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 shadow-sm z-10 overflow-hidden">
                <div className="flex border-b border-gray-200 shrink-0">
                  <button onClick={() => setActiveTab('stage')} className={`flex-1 py-3 text-[11px] font-bold transition-colors ${activeTab === 'stage' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>ステージ</button>
                  <button onClick={() => setActiveTab('chairs')} className={`flex-1 py-3 text-[11px] font-bold transition-colors ${activeTab === 'chairs' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>椅子/譜面台</button>
                  <button onClick={() => setActiveTab('percussion')} className={`flex-1 py-3 text-[11px] font-bold transition-colors ${activeTab === 'percussion' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>打楽器</button>
                </div>

                <div className="p-4 flex-1 overflow-y-auto flex flex-col gap-4">
                  {activeTab === 'stage' && (
                    <div className="space-y-4">
                      <p className="text-xs text-gray-500 mb-2">ステージの広さを0.5m単位で設定できます。</p>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">間口 (手前の幅)</label>
                        <div className="flex items-center gap-2">
                          <input type="number" step="0.5" min="2" value={stageFrontWidth} onChange={e => setStageFrontWidth(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500" />
                          <span className="text-xs text-gray-500">m</span>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">奥行き</label>
                        <div className="flex items-center gap-2">
                          <input type="number" step="0.5" min="2" value={stageDepth} onChange={e => setStageDepth(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500" />
                          <span className="text-xs text-gray-500">m</span>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">背面幅</label>
                        <div className="flex items-center gap-2">
                          <input type="number" step="0.5" min="2" value={stageBackWidth} onChange={e => setStageBackWidth(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500" />
                          <span className="text-xs text-gray-500">m</span>
                        </div>
                      </div>
                      <div className="pt-4 border-t border-gray-200 mt-2">
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input type="checkbox" checked={showGrid} onChange={e => setShowGrid(e.target.checked)} className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                          <span className="text-xs font-bold text-gray-700">1m単位のグリッド線を表示</span>
                        </label>
                      </div>
                    </div>
                  )}

                  {activeTab === 'chairs' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        {CHAIR_STAND_PALETTE.map((template, idx) => (
                          <button key={idx} onClick={() => handleAddItem(template)} className="p-2 rounded text-xs font-bold shadow-sm hover:bg-gray-100 transition flex flex-col items-center justify-center text-center border border-gray-300 bg-white text-gray-700 min-h-[60px]">
                            <Plus className="w-4 h-4 mb-1 opacity-50" />
                            {template.label}
                          </button>
                        ))}
                      </div>
                      <div className="mt-2 p-3 bg-gray-50 border border-gray-200 rounded-md text-xs font-bold text-gray-700 flex flex-col gap-2">
                        <div className="flex justify-between items-center border-b border-gray-200 pb-1">
                          <span>現在のステージ配置数</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span>椅子</span>
                          <span className="text-blue-600 text-sm">{items.filter(i => i.type === 'chair').length} 脚</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span>譜面台</span>
                          <span className="text-blue-600 text-sm">{items.filter(i => i.type === 'stand').length} 台</span>
                        </div>
                      </div>
                    </>
                  )}

                  {activeTab === 'percussion' && (
                    <div className="grid grid-cols-2 gap-2">
                      {PERCUSSION_PALETTE.map((template, idx) => (
                        <button key={idx} onClick={() => handleAddItem(template)} className="p-2 rounded text-[11px] font-bold shadow-sm hover:bg-gray-100 transition flex flex-col items-center justify-center text-center border border-gray-300 bg-white text-gray-700 min-h-[60px]">
                          <Plus className="w-4 h-4 mb-1 opacity-50" />
                          {template.label}
                        </button>
                      ))}
                    </div>
                  )}
                  
                  <div className="mt-4 p-3 bg-blue-50 text-blue-800 rounded-md text-xs leading-relaxed border border-blue-100">
                    <p className="font-bold mb-1 flex items-center gap-1"><Info className="w-4 h-4"/> 使い方</p>
                    <ul className="list-disc pl-4 space-y-1">
                      <li>左のボタンからアイテムを配置し、ドラッグで移動。</li>
                      <li>選択後、右のパネルでパート名や向きを編集。</li>
                      <li>椅子の図は、マゼンタの曲線部分が「背もたれ」です。</li>
                    </ul>
                  </div>
                </div>
              </aside>
            )}

            {/* ステージ（キャンバスエリア） */}
            <main 
              className={`flex-1 relative overflow-auto bg-gray-200 flex items-center justify-center p-8 touch-none ${isPrinting ? 'bg-white p-0 items-start justify-start' : ''}`}
              onMouseMove={onDrag}
              onMouseUp={stopDrag}
              onMouseLeave={stopDrag}
              onTouchMove={onDrag}
              onTouchEnd={stopDrag}
              onTouchCancel={stopDrag}
            >
              <div 
                ref={stageRef}
                className={`relative flex-shrink-0 ${isPrinting ? 'scale-100 origin-top-left' : ''}`}
                style={{ width: `${maxWidthPx}px`, height: `${depthPx}px` }}
                onMouseDown={handleStageClick}
                onTouchStart={handleStageClick}
              >
                {/* ステージ背景（台形クリップパス） */}
                <div className="absolute inset-0" style={{ filter: isPrinting ? 'none' : 'drop-shadow(0 10px 15px rgba(0,0,0,0.1))' }}>
                  <div 
                    className="w-full h-full bg-white"
                    style={{ 
                      clipPath: clipPathValue,
                      backgroundImage: showGrid ? 'linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px)' : 'none',
                      backgroundSize: `${PPM}px ${PPM}px`,
                      backgroundPosition: 'center bottom',
                    }}
                  ></div>
                </div>

                <div className="absolute bottom-0 w-full text-center py-2 text-gray-400 font-bold tracking-widest border-t-2 border-dashed border-gray-300 select-none z-10" style={{ left: `${bottomLeftPct}%`, width: `${bottomRightPct - bottomLeftPct}%` }}>
                  AUDIENCE (客席)
                </div>

                {items.map((item) => (
                  <div
                    key={item.id}
                    onMouseDown={(e) => startDrag(e, item.id)}
                    onTouchStart={(e) => startDrag(e, item.id)}
                    className={`absolute cursor-move select-none flex items-center justify-center transition-shadow
                      ${selectedId === item.id && !isPrinting ? 'ring-2 ring-blue-500 ring-offset-2 z-50' : 'z-20 hover:drop-shadow-md'}
                    `}
                    style={{ left: item.x, top: item.y, width: item.width, height: item.height, transform: `rotate(${item.rotation}deg)`, transformOrigin: 'center center' }}
                  >
                    {item.type === 'chair' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90" fill="none" stroke="#FF00FF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <line x1="20" y1="15" x2="20" y2="85" />
                        <line x1="20" y1="15" x2="85" y2="15" />
                        <line x1="20" y1="85" x2="85" y2="85" />
                        <line x1="65" y1="15" x2="65" y2="85" />
                        <path d="M65 15 Q 70 50 65 85" />
                        <path d="M72 15 Q 78 50 72 85" />
                        <path d="M78 15 Q 85 50 78 85" />
                        <line x1="85" y1="15" x2="85" y2="85" />
                      </svg>
                    )}
                    {item.type === 'stand' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#0000EE" strokeWidth="2" strokeLinejoin="round">
                          <rect x="20" y="35" width="60" height="30" />
                          <rect x="26" y="41" width="48" height="18" />
                          <rect x="46" y="65" width="8" height="6" />
                          <line x1="50" y1="71" x2="50" y2="86" />
                          <polygon points="50,86 46,89 46,95 50,98 54,95 54,89" />
                          <line x1="30" y1="35" x2="18" y2="20" />
                          <g transform="translate(18, 20) rotate(-40)"><polygon points="0,0 -4,-3 -4,-10 0,-13 4,-10 4,-3" /></g>
                          <line x1="70" y1="35" x2="82" y2="20" />
                          <g transform="translate(82, 20) rotate(40)"><polygon points="0,0 -4,-3 -4,-10 0,-13 4,-10 4,-3" /></g>
                        </g>
                      </svg>
                    )}
                    {item.type === 'conductor_stand' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <rect x="5" y="5" width="90" height="90" rx="5" fill="none" stroke="#444" strokeWidth="3" />
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#666" strokeWidth="2" />
                      </svg>
                    )}
                    {item.type === 'timpani' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <circle cx="50" cy="50" r="46" fill="white" stroke="#666" strokeWidth="4" />
                      </svg>
                    )}
                    {item.type === 'drums' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="white" stroke="#666" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                          <rect x="38" y="42" width="24" height="38" />
                          <line x1="38" y1="50" x2="62" y2="50" />
                          <line x1="38" y1="72" x2="62" y2="72" />
                          <line x1="50" y1="42" x2="50" y2="80" />
                          <line x1="42" y1="80" x2="35" y2="95" />
                          <line x1="58" y1="80" x2="65" y2="95" />
                          <rect x="45" y="68" width="10" height="6" />
                          <line x1="50" y1="68" x2="44" y2="58" />
                          <line x1="50" y1="68" x2="56" y2="58" />
                          <circle cx="50" cy="10" r="9" />
                          <rect x="47" y="24" width="6" height="15" rx="2" fill="#666" />
                          <g transform="translate(26, 30) rotate(-15)"><path d="M-14,0 L-14,8 Q0,18 14,8 L14,0 Z" fill="white" /><circle cx="0" cy="0" r="14" fill="white" /></g>
                          <g transform="translate(74, 40) rotate(15)"><path d="M-13,0 L-13,9 Q0,19 13,9 L13,0 Z" fill="white" /><circle cx="0" cy="0" r="13" fill="white" /><line x1="-6" y1="-8" x2="6" y2="8" strokeWidth="2" stroke="#666" /><line x1="-10" y1="-2" x2="2" y2="12" strokeWidth="2" stroke="#666" /></g>
                          <g transform="translate(40, 52) rotate(-20)"><path d="M-11,0 L-11,8 Q0,16 11,8 L11,0 Z" fill="white" /><circle cx="0" cy="0" r="11" fill="white" /></g>
                          <g transform="translate(60, 52) rotate(20)"><path d="M-11,0 L-11,8 Q0,16 11,8 L11,0 Z" fill="white" /><circle cx="0" cy="0" r="11" fill="white" /></g>
                          <g transform="translate(16, 48)"><line x1="-12" y1="-12" x2="0" y2="0" /><line x1="-6" y1="12" x2="0" y2="0" /><circle cx="0" cy="0" r="14" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                          <g transform="translate(28, 74)"><line x1="-8" y1="12" x2="0" y2="0" /><line x1="-12" y1="-6" x2="0" y2="0" /><circle cx="0" cy="0" r="13" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                          <g transform="translate(85, 20)"><path d="M-14,-2 L-26,4 L-24,8 L-14,3 Z" fill="#666" stroke="none" /><circle cx="0" cy="0" r="13" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                          <g transform="translate(80, 66)"><line x1="4" y1="4" x2="14" y2="14" strokeWidth="1.5" /><line x1="14" y1="14" x2="8" y2="28" strokeWidth="1.5" /><line x1="14" y1="14" x2="28" y2="10" strokeWidth="1.5" /><circle cx="0" cy="0" r="13" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                        </g>
                      </svg>
                    )}
                    {item.type === 'mallet' && (
                      <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="white" stroke="#666" strokeWidth="2.5" strokeLinejoin="round">
                          <polygon points="5,35 95,10 95,90 5,65" />
                          {[...Array(28)].map((_, i) => {
                            const ratio = (i + 1) / 29;
                            const x = 5 + 90 * ratio;
                            const topY = 35 - 25 * ratio;
                            const bottomY = 65 + 25 * ratio;
                            return <line key={i} x1={x} y1={topY} x2={x} y2={bottomY} strokeWidth="1.5" stroke="#666" />;
                          })}
                        </g>
                      </svg>
                    )}
                    {item.type === 'cymbals' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                          <polygon points="26,10 10,50 26,90" />
                          <polygon points="34,10 50,50 34,90" />
                          <line x1="26" y1="50" x2="34" y2="50" />
                          <line x1="30" y1="50" x2="30" y2="85" />
                          <line x1="30" y1="85" x2="15" y2="95" />
                          <line x1="30" y1="85" x2="45" y2="95" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'tam_tam' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="20" y1="10" x2="80" y2="10" strokeWidth="3" />
                          <line x1="20" y1="10" x2="10" y2="90" strokeWidth="3" />
                          <line x1="80" y1="10" x2="90" y2="90" strokeWidth="3" />
                          <line x1="20" y1="10" x2="30" y2="28" strokeWidth="1.5" />
                          <line x1="80" y1="10" x2="70" y2="28" strokeWidth="1.5" />
                          <circle cx="50" cy="50" r="35" fill="white" strokeWidth="3" />
                          <circle cx="50" cy="50" r="20" strokeWidth="2" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'tubular_bells' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2" strokeLinejoin="round">
                          <rect x="15" y="5" width="70" height="90" strokeWidth="2.5" />
                          {[...Array(10)].map((_, i) => {
                            const x = 15 + ((i + 1) * (70/11));
                            const y = 85 - (i * 6);
                            return (
                              <React.Fragment key={i}>
                                <line x1={x} y1="5" x2={x} y2={y} />
                                <line x1={15 + (i * (70/11))} y1={y} x2={x} y2={y} />
                              </React.Fragment>
                            );
                          })}
                          <line x1={15 + (10 * (70/11))} y1={85 - (10 * 6)} x2="85" y2={85 - (10 * 6)} />
                        </g>
                      </svg>
                    )}
                    {item.type === 'bass_drum' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinejoin="round">
                          <line x1="20" y1="80" x2="20" y2="95" />
                          <line x1="40" y1="80" x2="40" y2="95" />
                          <line x1="10" y1="95" x2="50" y2="95" />
                          <path d="M 20 10 L 40 10 A 10 35 0 0 1 40 80 L 20 80" fill="white" />
                          <ellipse cx="20" cy="45" rx="10" ry="35" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'side_drum' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="85" x2="10" y2="95" />
                          <line x1="30" y1="85" x2="50" y2="95" />
                          <line x1="30" y1="85" x2="35" y2="95" />
                          <line x1="30" y1="55" x2="30" y2="85" />
                          <path d="M 10 25 L 10 55 A 20 8 0 0 0 50 55 L 50 25 Z" fill="white" />
                          <ellipse cx="30" cy="25" rx="20" ry="8" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'bongo' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="85" x2="10" y2="95" />
                          <line x1="30" y1="85" x2="50" y2="95" />
                          <line x1="30" y1="85" x2="35" y2="95" />
                          <line x1="30" y1="20" x2="30" y2="85" />
                          <path d="M 2 20 L 6 40 A 10 4 0 0 0 26 40 L 30 20 Z" fill="white" />
                          <ellipse cx="16" cy="20" rx="14" ry="6" fill="white" />
                          <path d="M 30 20 L 34 40 A 10 4 0 0 0 54 40 L 58 20 Z" fill="white" />
                          <ellipse cx="44" cy="20" rx="14" ry="6" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'conga' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="85" x2="10" y2="95" />
                          <line x1="30" y1="85" x2="50" y2="95" />
                          <line x1="30" y1="85" x2="35" y2="95" />
                          <line x1="30" y1="40" x2="30" y2="85" />
                          <path d="M 4 15 Q -2 45 4 75 A 11 4 0 0 0 26 75 Q 32 45 26 15 Z" fill="white" />
                          <ellipse cx="15" cy="15" rx="11" ry="5" fill="white" />
                          <path d="M 34 15 Q 28 45 34 75 A 11 4 0 0 0 56 75 Q 62 45 56 15 Z" fill="white" />
                          <ellipse cx="45" cy="15" rx="11" ry="5" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'concert_toms' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="80" x2="10" y2="95" />
                          <line x1="30" y1="80" x2="50" y2="95" />
                          <line x1="30" y1="80" x2="35" y2="95" />
                          <line x1="30" y1="30" x2="30" y2="80" />
                          <line x1="26" y1="30" x2="34" y2="30" />
                          <path d="M 2 15 L 2 40 A 12 5 0 0 0 26 40 L 26 15 Z" fill="white" />
                          <ellipse cx="14" cy="15" rx="12" ry="5" fill="white" />
                          <path d="M 34 15 L 34 40 A 12 5 0 0 0 58 40 L 58 15 Z" fill="white" />
                          <ellipse cx="46" cy="15" rx="12" ry="5" fill="white" />
                        </g>
                      </svg>
                    )}

                    {item.type !== 'stand' && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none p-0.5" style={{ transform: `rotate(${-item.rotation}deg)` }}>
                        {item.type === 'timpani' ? (
                          <span className="text-gray-600 font-bold" style={{ fontSize: `${item.width * 0.3}px` }}>{item.inch}"</span>
                        ) : (
                          <span className="text-gray-800 font-bold text-center leading-tight" style={{ fontSize: item.type === 'mallet' ? `${Math.max(9, item.height * 0.25)}px` : '9px', maxWidth: (item.type === 'tam_tam' || item.type === 'bass_drum' || item.type === 'side_drum' || item.type === 'bongo' || item.type === 'conga' || item.type === 'concert_toms') ? '65%' : '100%', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{item.label}</span>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </main>

            {/* 右サイドバー: プロパティエディタ */}
            {!isPrinting && (
              <aside className="w-72 bg-white border-l border-gray-200 p-5 flex flex-col gap-6 shrink-0 shadow-sm z-10 overflow-y-auto">
                <div>
                  <h2 className="text-sm font-bold text-gray-500 mb-4 uppercase tracking-wider border-b pb-2">
                    選択中のアイテム
                  </h2>
                  {selectedItem ? (
                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">パート名 / 表示名</label>
                        <input type="text" value={selectedItem.label} onChange={(e) => updateSelectedItem('label', e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                      </div>

                      {selectedItem.type === 'mallet' && (
                        <div className="pt-2 border-t border-gray-100">
                          <h3 className="text-[11px] font-bold text-blue-600 mb-2">サイズ調整 (鍵盤打楽器)</h3>
                          <div className="space-y-3 bg-blue-50/50 p-2 rounded border border-blue-100">
                            <div>
                              <div className="flex justify-between text-[10px] text-gray-600 mb-1"><span>横幅</span><span>{selectedItem.width}px</span></div>
                              <input type="range" min="40" max="150" step="5" value={selectedItem.width} onChange={(e) => updateSelectedItem('width', parseInt(e.target.value))} className="w-full accent-blue-500" />
                            </div>
                            <div>
                              <div className="flex justify-between text-[10px] text-gray-600 mb-1"><span>奥行き</span><span>{selectedItem.height}px</span></div>
                              <input type="range" min="15" max="80" step="5" value={selectedItem.height} onChange={(e) => updateSelectedItem('height', parseInt(e.target.value))} className="w-full accent-blue-500" />
                            </div>
                          </div>
                        </div>
                      )}

                      <div>
                        <div className="flex justify-between mb-1"><label className="block text-xs font-bold text-gray-700">向き (角度: {selectedItem.rotation}°)</label></div>
                        <input type="range" min="-180" max="180" step="5" value={selectedItem.rotation} onChange={(e) => updateSelectedItem('rotation', parseInt(e.target.value))} className="w-full" />
                        <div className="flex justify-between text-xs text-gray-400 mt-1"><span>左回</span><span>正面</span><span>右回</span></div>
                        <div className="grid grid-cols-4 gap-1 mt-2">
                          {[-90, 0, 90, 180].map(deg => (
                            <button key={deg} onClick={() => updateSelectedItem('rotation', deg)} className="px-1 py-1 bg-gray-100 hover:bg-gray-200 rounded text-[10px] text-gray-600">{deg}°</button>
                          ))}
                        </div>
                      </div>

                      <div className="pt-4 border-t border-gray-100">
                        <button onClick={deleteSelectedItem} className="w-full px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded text-sm font-bold flex items-center justify-center gap-2 transition">
                          <Trash2 className="w-4 h-4" /> このアイテムを削除
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="text-sm text-gray-400 text-center py-10 bg-gray-50 rounded border border-dashed border-gray-200">
                      ステージ上のアイテムを<br/>クリックして選択してください
                    </div>
                  )}
                </div>
              </aside>
            )}
          </div>
        </div>
      );
    }

    // アプリケーションの描画
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
