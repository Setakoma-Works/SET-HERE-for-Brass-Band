    // --- スケール設定 (1m = 90px に設定) ---

    const pxToCm = (px) => Math.round(px / (PPM / 100)); // 1cm = 0.9px
    const cmToPx = (cm) => Math.round(cm * (PPM / 100));

      { id: '26_2', type: 'timpani', inch: '29', label: 'Timp 29"', x: 235, y: 215, rotation: 0, width: 55, height: 55 },

      { id: '26_4', type: 'timpani', inch: '23', label: 'Timp 23"', x: 350, y: 240, rotation: 0, width: 45, height: 45 },
      { id: '27', type: 'drums', label: 'Drums', x: 790, y: 230, rotation: 0, width: 108, height: 108 },
      { id: '28', type: 'mallet', label: 'Marimba', x: 750, y: 620, rotation: 0, width: 110, height: 45 },
    ];

    // --- メインアプリ ---
    function App() {
      const [lang, setLang] = useState('ja');
      const text = dict[lang];

      const [items, setItems] = useState([...getStandardLayout('ja')]);
      const [history, setHistory] = useState([[...getStandardLayout('ja')]]);
      const [historyStep, setHistoryStep] = useState(0);
      
      const itemsRef = useRef(items);
      useEffect(() => {
        itemsRef.current = items;
      }, [items]);

      const [selectedIds, setSelectedIds] = useState([]);
      const [selectionBox, setSelectionBox] = useState(null);
      const [isPrinting, setIsPrinting] = useState(false);
      const [activeTab, setActiveTab] = useState('stage');
      
      const [stageFrontWidth, setStageFrontWidth] = useState(12.0);
      const [stageBackWidth, setStageBackWidth] = useState(8.0);
      const [stageDepth, setStageDepth] = useState(8.0);
      const [showGrid, setShowGrid] = useState(true);
      const [gridInterval, setGridInterval] = useState(90); // 90px=1m, 162px=1.8m

      const stageRef = useRef(null);
      const dragState = useRef({ type: null, startMouseX: 0, startMouseY: 0, items: [], hasMoved: false });

      // 履歴に明示的に保存する
      const commitChange = (newItems) => {
        setItems(newItems);
        const newHistory = history.slice(0, historyStep + 1);
        newHistory.push(newItems);
        setHistory(newHistory);
        setHistoryStep(newHistory.length - 1);
      };

      // 現在の items 状態を履歴に保存する
      const commitCurrentItems = () => {
        const currentItems = itemsRef.current;
        const lastHistory = history[historyStep];
        if (JSON.stringify(lastHistory) !== JSON.stringify(currentItems)) {
          const newHistory = history.slice(0, historyStep + 1);
          newHistory.push(currentItems);
          setHistory(newHistory);
          setHistoryStep(newHistory.length - 1);
        }
      };

      const handleUndo = () => {
        if (historyStep > 0) {
          const prevStep = historyStep - 1;
          setHistoryStep(prevStep);
          setItems(history[prevStep]);
          setSelectedIds([]);
        }
      };

      const handleRedo = () => {
        if (historyStep < history.length - 1) {
          const nextStep = historyStep + 1;
          setHistoryStep(nextStep);
          setItems(history[nextStep]);
          setSelectedIds([]);
        }
      };

      const handleAddItem = (template) => {
        const newItem = {
          ...template,
          id: Date.now().toString(),
          x: (Math.max(stageFrontWidth, stageBackWidth) * PPM) / 2 - 20,
          y: (stageDepth * PPM) / 2 - 20,
          rotation: 0,
        };
        const newItems = [...itemsRef.current, newItem];
        commitChange(newItems);
        setSelectedIds([newItem.id]);
      };

      const handleClearStage = () => {
        if (window.confirm(text.confirmClear)) {
          commitChange([]);
          setSelectedIds([]);
        }
      };

      const handleLoadStandard = () => {
        if (itemsRef.current.length === 0 || window.confirm(text.confirmLoad)) {
          commitChange([...getStandardLayout(lang)]);
          setStageFrontWidth(12.0);
          setStageBackWidth(8.0);
          setStageDepth(8.0);
          setSelectedIds([]);
        }
      };

      // マウス/タッチのステージ上座標を取得
      const getMouseCoords = (e) => {
        const stageRect = stageRef.current.getBoundingClientRect();
        const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
        const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
        return { x: clientX - stageRect.left, y: clientY - stageRect.top };
      };

      // アイテムをドラッグ（単一・複数）開始
      const startDrag = (e, id) => {
        if (isPrinting) return;
        e.stopPropagation();
        
        let newSelectedIds = selectedIds;
        // クリックしたアイテムが選択中でなければ、そのアイテムだけを選択状態にする（Shiftキーで追加も可能）
        if (!selectedIds.includes(id)) {
          newSelectedIds = e.shiftKey ? [...selectedIds, id] : [id];
          setSelectedIds(newSelectedIds);
        }

        const coords = getMouseCoords(e);
        const dragItems = itemsRef.current
          .filter(i => newSelectedIds.includes(i.id))
          .map(i => ({ id: i.id, startX: i.x, startY: i.y }));

        dragState.current = {
          type: 'item',
          startMouseX: coords.x,
          startMouseY: coords.y,
          items: dragItems,
          hasMoved: false
        };
      };

      // ステージ上でドラッグ開始（範囲選択枠の作成）
      const handleStageMouseDown = (e) => {
        if (isPrinting) return;
        const coords = getMouseCoords(e);
        
        if (!e.shiftKey) {
          setSelectedIds([]);
        }

        dragState.current = {
          type: 'selection',
          startMouseX: coords.x,
          startMouseY: coords.y,
          items: [],
          hasMoved: false
        };
        setSelectionBox({ x: coords.x, y: coords.y, w: 0, h: 0 });
      };

      const onDrag = (e) => {
        if (!dragState.current.type || isPrinting) return;
        const coords = getMouseCoords(e);

        if (dragState.current.type === 'item') {
          dragState.current.hasMoved = true;
          // アイテムの移動
          const deltaX = coords.x - dragState.current.startMouseX;
          const deltaY = coords.y - dragState.current.startMouseY;

          setItems((prev) =>
            prev.map((item) => {
              const dragItem = dragState.current.items.find(i => i.id === item.id);
              if (dragItem) {
                return { ...item, x: dragItem.startX + deltaX, y: dragItem.startY + deltaY };
              }
              return item;
            })
          );
        } else if (dragState.current.type === 'selection') {
          // 範囲選択ボックスの描画とアイテムの選択
          const startX = dragState.current.startMouseX;
          const startY = dragState.current.startMouseY;
          const x = Math.min(startX, coords.x);
          const y = Math.min(startY, coords.y);
          const w = Math.abs(coords.x - startX);
          const h = Math.abs(coords.y - startY);
          
          setSelectionBox({ x, y, w, h });
          
          const newlySelected = itemsRef.current.filter(item => {
            const cx = item.x + item.width / 2;
            const cy = item.y + item.height / 2;
            return cx >= x && cx <= x + w && cy >= y && cy <= y + h;
          }).map(i => i.id);
          
          setSelectedIds(newlySelected);
        }
      };

      const stopDrag = () => {
        if (dragState.current.type === 'item' && dragState.current.hasMoved) {
          commitCurrentItems();
        }
        dragState.current = { type: null, startMouseX: 0, startMouseY: 0, items: [], hasMoved: false };
        setSelectionBox(null);
      };

      const updateSelectedItem = (key, value, shouldCommit = false) => {
        if (selectedIds.length === 1) {
          const newItems = itemsRef.current.map((item) =>
            item.id === selectedIds[0] ? { ...item, [key]: value } : item
          );
          if (shouldCommit) {
            commitChange(newItems);
          } else {
            setItems(newItems);
          }
        }
      };

      const deleteSelectedItems = () => {
        const newItems = itemsRef.current.filter((item) => !selectedIds.includes(item.id));
        commitChange(newItems);
        setSelectedIds([]);
      };

      const handlePrint = () => {
        setSelectedIds([]);
        setIsPrinting(true);
        setTimeout(() => {
          window.print();
          setIsPrinting(false);
        }, 300);
      };

      const maxWidthPx = Math.max(stageFrontWidth, stageBackWidth) * PPM;
      const depthPx = stageDepth * PPM;
      
      const diffFront = maxWidthPx - (stageFrontWidth * PPM);
      const diffBack = maxWidthPx - (stageBackWidth * PPM);
      const topLeftPct = (diffBack / 2 / maxWidthPx) * 100;
      const topRightPct = 100 - topLeftPct;
      const bottomLeftPct = (diffFront / 2 / maxWidthPx) * 100;
      const bottomRightPct = 100 - bottomLeftPct;
      const clipPathValue = `polygon(${topLeftPct}% 0%, ${topRightPct}% 0%, ${bottomRightPct}% 100%, ${bottomLeftPct}% 100%)`;
      const stagePolygonPoints = `${maxWidthPx * topLeftPct / 100},0 ${maxWidthPx * topRightPct / 100},0 ${maxWidthPx * bottomRightPct / 100},${depthPx} ${maxWidthPx * bottomLeftPct / 100},${depthPx}`;

      return (
        <div className="flex flex-col h-full bg-gray-50 font-sans text-gray-900">
          {/* ヘッダー */}
          {!isPrinting && (
            <header className="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center z-10 shrink-0">
              <div>
                <h1 className="text-xl font-bold flex items-center gap-2">
                  <Move className="w-5 h-5" />
                  SET-HERE for Brass Band
                </h1>
                <p className="text-xs text-slate-300 mt-1">{text.subtitle}</p>
              </div>
              <div className="flex gap-3">
                {/* 言語切り替えボタン */}
                <button
                  onClick={() => setLang(lang === 'ja' ? 'en' : 'ja')}
                  className="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-medium transition flex items-center gap-2 border border-slate-600"
                >
                  <Globe className="w-4 h-4" />
                  {lang === 'ja' ? 'English' : '日本語'}
                </button>

                {/* Undo / Redo ボタン群 */}
                <div className="flex bg-slate-700 rounded overflow-hidden border border-slate-600 shadow-sm">
                  <button onClick={handleUndo} disabled={historyStep === 0} className={`px-3 py-2 flex items-center justify-center transition ${historyStep === 0 ? 'text-slate-500 cursor-not-allowed bg-slate-800' : 'text-white hover:bg-slate-600'}`} title={text.undo}>
                    <UndoIcon className="w-4 h-4" />
                  </button>
                  <div className="w-px bg-slate-600"></div>
                  <button onClick={handleRedo} disabled={historyStep === history.length - 1} className={`px-3 py-2 flex items-center justify-center transition ${historyStep === history.length - 1 ? 'text-slate-500 cursor-not-allowed bg-slate-800' : 'text-white hover:bg-slate-600'}`} title={text.redo}>
                    <RedoIcon className="w-4 h-4" />
                  </button>
                </div>

                <button
                  onClick={handleLoadStandard}
                  className="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-medium transition flex items-center gap-2 whitespace-nowrap"
                >
                  <RotateCcw className="w-4 h-4" />
                  {text.loadStandard}
                </button>
                <button
                  onClick={handleClearStage}
                  className="px-3 py-2 bg-red-600 hover:bg-red-500 rounded text-sm font-medium transition flex items-center gap-2"
                >
                  <Trash2 className="w-4 h-4" />
                  {text.clear}
                </button>
                <button
                  onClick={handlePrint}
                  className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-medium transition flex items-center gap-2 whitespace-nowrap"
                >
                  <Printer className="w-4 h-4" />
                  {text.print}
                </button>
              </div>
            </header>
          )}

          {/* メインエリア */}
          <div className="flex flex-1 overflow-hidden relative">
            
            {/* 左サイドバー: アイテムパレット＆設定 */}
            {!isPrinting && (
              <aside className="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 shadow-sm z-10 overflow-hidden">
                <div className="flex border-b border-gray-200 shrink-0">
                  <button onClick={() => setActiveTab('stage')} className={`flex-1 py-3 text-[11px] font-bold transition-colors ${activeTab === 'stage' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>{text.tabStage}</button>
                  <button onClick={() => setActiveTab('chairs')} className={`flex-1 py-3 text-[11px] font-bold transition-colors ${activeTab === 'chairs' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>{text.tabChairs}</button>
                  <button onClick={() => setActiveTab('percussion')} className={`flex-1 py-3 text-[11px] font-bold transition-colors ${activeTab === 'percussion' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}>{text.tabPercussion}</button>
                </div>

                <div className="p-4 flex-1 overflow-y-auto flex flex-col gap-4">
                  {activeTab === 'stage' && (
                    <div className="space-y-4">
                      <p className="text-xs text-gray-500 mb-2">{text.stageDesc}</p>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">{text.frontWidth}</label>
                        <div className="flex items-center gap-2">
                          <input type="number" step="0.5" min="2" value={stageFrontWidth} onChange={e => setStageFrontWidth(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500" />
                          <span className="text-xs text-gray-500">m</span>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">{text.depth}</label>
                        <div className="flex items-center gap-2">
                          <input type="number" step="0.5" min="2" value={stageDepth} onChange={e => setStageDepth(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500" />
                          <span className="text-xs text-gray-500">m</span>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">{text.backWidth}</label>
                        <div className="flex items-center gap-2">
                          <input type="number" step="0.5" min="2" value={stageBackWidth} onChange={e => setStageBackWidth(parseFloat(e.target.value) || 0)} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500" />
                          <span className="text-xs text-gray-500">m</span>
                        </div>
                      </div>
                      <div className="pt-4 border-t border-gray-200 mt-2">
                        <label className="flex items-center gap-2 cursor-pointer mb-2">
                          <input type="checkbox" checked={showGrid} onChange={e => setShowGrid(e.target.checked)} className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" />
                          <span className="text-xs font-bold text-gray-700">{text.showGrid}</span>
                        </label>
                        {showGrid && (
                          <div className="flex flex-col gap-2 pl-6">
                            <label className="flex items-center gap-2 cursor-pointer text-xs text-gray-600 font-bold">
                              <input type="radio" name="gridInterval" value="90" checked={gridInterval === 90} onChange={() => setGridInterval(90)} className="text-blue-600 focus:ring-blue-500" />
                              {text.grid1m}
                            </label>
                            <label className="flex items-center gap-2 cursor-pointer text-xs text-gray-600 font-bold">
                              <input type="radio" name="gridInterval" value="162" checked={gridInterval === 162} onChange={() => setGridInterval(162)} className="text-blue-600 focus:ring-blue-500" />
                              {text.grid1_8m}
                            </label>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {activeTab === 'chairs' && (
                    <>
                      <div className="grid grid-cols-2 gap-2">
                        {getChairStandPalette(lang).map((template, idx) => (
                          <button key={idx} onClick={() => handleAddItem(template)} className="p-2 rounded text-xs font-bold shadow-sm hover:bg-gray-100 transition flex flex-col items-center justify-center text-center border border-gray-300 bg-white text-gray-700 min-h-[60px]">
                            <Plus className="w-4 h-4 mb-1 opacity-50" />
                            {template.label}
                          </button>
                        ))}
                      </div>
                      <div className="mt-2 p-3 bg-gray-50 border border-gray-200 rounded-md text-xs font-bold text-gray-700 flex flex-col gap-2">
                        <div className="flex justify-between items-center border-b border-gray-200 pb-1">
                          <span>{text.currentItems}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span>{text.chairs}</span>
                          <span className="text-blue-600 text-sm">{items.filter(i => i.type === 'chair').length} {text.unitChair}</span>
                        </div>
                        <div className="flex justify-between items-center">
                          <span>{text.stands}</span>
                          <span className="text-blue-600 text-sm">{items.filter(i => i.type === 'stand').length} {text.unitStand}</span>
                        </div>
                      </div>
                    </>
                  )}

                  {activeTab === 'percussion' && (
                    <div className="grid grid-cols-2 gap-2">
                      {getPercussionPalette(lang).map((template, idx) => (
                        <button key={idx} onClick={() => handleAddItem(template)} className="p-2 rounded text-[11px] font-bold shadow-sm hover:bg-gray-100 transition flex flex-col items-center justify-center text-center border border-gray-300 bg-white text-gray-700 min-h-[60px]">
                          <Plus className="w-4 h-4 mb-1 opacity-50" />
                          {template.label}
                        </button>
                      ))}
                    </div>
                  )}
                  
                  <div className="mt-4 p-3 bg-blue-50 text-blue-800 rounded-md text-xs leading-relaxed border border-blue-100">
                    <p className="font-bold mb-1 flex items-center gap-1"><Info className="w-4 h-4"/> {text.howToUse}</p>
                    <ul className="list-disc pl-4 space-y-1">
                      <li>{text.desc1}</li>
                      <li>{text.desc2}</li>
                      <li>{text.desc3}</li>
                    </ul>
                  </div>
                </div>
              </aside>
            )}

            {/* ステージ（キャンバスエリア） */}
            <main 
              className={`flex-1 relative overflow-auto bg-gray-200 flex items-center justify-center p-8 touch-none ${isPrinting ? 'bg-white p-0 items-start justify-start' : ''}`}
              onMouseMove={onDrag}
              onMouseUp={stopDrag}
              onMouseLeave={stopDrag}
              onTouchMove={onDrag}
              onTouchEnd={stopDrag}
              onTouchCancel={stopDrag}
            >
              <div 
                ref={stageRef}
                className={`relative flex-shrink-0 ${isPrinting ? 'scale-100 origin-top-left' : ''}`}
                style={{ width: `${maxWidthPx}px`, height: `${depthPx}px` }}
                onMouseDown={handleStageMouseDown}
                onTouchStart={handleStageMouseDown}
              >
                {/* ステージ背景（台形クリップパス） */}
                <div className="absolute inset-0" style={{ filter: isPrinting ? 'none' : 'drop-shadow(0 10px 15px rgba(0,0,0,0.1))' }}>
                  <div 
                    className="w-full h-full bg-white"
                    style={{ 
                      clipPath: clipPathValue,
                      backgroundImage: showGrid ? 'linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px)' : 'none',
                      backgroundSize: `${gridInterval}px ${gridInterval}px`,
                      // 縦のグリッド線を常にコンテナの中心に合わせる計算
                      backgroundPosition: `calc(50% + ${gridInterval / 2}px) bottom`,
                    }}
                  ></div>
                </div>

                {/* ステージ枠線（印刷時は濃く、編集中は薄く表示される） */}
                <svg className="absolute inset-0 pointer-events-none z-10" style={{ width: '100%', height: '100%' }}>
                  <polygon 
                    points={stagePolygonPoints} 
                    fill="none" 
                    stroke={isPrinting ? "#333" : "#cbd5e1"} 
                    strokeWidth={isPrinting ? "3" : "2"} 
                  />
                </svg>

                <div className="absolute bottom-0 w-full text-center py-2 text-gray-400 font-bold tracking-widest select-none z-10" style={{ left: `${bottomLeftPct}%`, width: `${bottomRightPct - bottomLeftPct}%` }}>
                  {text.audience}
                </div>

                {/* 範囲選択ボックスの描画 */}
                {selectionBox && (
                  <div 
                    className="absolute border border-blue-500 bg-blue-500/20 z-40 pointer-events-none"
                    style={{ left: selectionBox.x, top: selectionBox.y, width: selectionBox.w, height: selectionBox.h }}
                  ></div>
                )}

                {items.map((item) => (
                  <div
                    key={item.id}
                    onMouseDown={(e) => startDrag(e, item.id)}
                    onTouchStart={(e) => startDrag(e, item.id)}
                    className={`absolute cursor-move select-none flex items-center justify-center transition-shadow
                      ${selectedIds.includes(item.id) && !isPrinting ? 'ring-2 ring-blue-500 ring-offset-2 z-50' : 'z-20 hover:drop-shadow-md'}
                    `}
                    style={{ left: item.x, top: item.y, width: item.width, height: item.height, transform: `rotate(${item.rotation}deg)`, transformOrigin: 'center center' }}
                  >
                    {item.type === 'chair' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90" fill="none" stroke="#FF00FF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        <line x1="5" y1="5" x2="5" y2="95" />
                        <line x1="5" y1="5" x2="95" y2="5" />
                        <line x1="5" y1="95" x2="95" y2="95" />
                        <line x1="68" y1="5" x2="68" y2="95" />
                        <path d="M 68 5 Q 77 50 68 95" />
                        <path d="M 77 5 Q 86 50 77 95" />
                        <path d="M 86 5 Q 95 50 86 95" />
                        <line x1="95" y1="5" x2="95" y2="95" />
                      </svg>
                    )}
                    {item.type === 'stand' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#0000EE" strokeWidth="2" strokeLinejoin="round">
                          <rect x="20" y="35" width="60" height="30" />
                          <rect x="26" y="41" width="48" height="18" />
                          <rect x="46" y="65" width="8" height="6" />
                          <line x1="50" y1="71" x2="50" y2="86" />
                          <polygon points="50,86 46,89 46,95 50,98 54,95 54,89" />
                          <line x1="30" y1="35" x2="18" y2="20" />
                          <g transform="translate(18, 20) rotate(-40)"><polygon points="0,0 -4,-3 -4,-10 0,-13 4,-10 4,-3" /></g>
                          <line x1="70" y1="35" x2="82" y2="20" />
                          <g transform="translate(82, 20) rotate(40)"><polygon points="0,0 -4,-3 -4,-10 0,-13 4,-10 4,-3" /></g>
                        </g>
                      </svg>
                    )}
                    {item.type === 'conductor_stand' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <rect x="5" y="5" width="90" height="90" rx="5" fill="none" stroke="#444" strokeWidth="3" />
                        <circle cx="50" cy="50" r="30" fill="none" stroke="#666" strokeWidth="2" />
                      </svg>
                    )}
                    {item.type === 'timpani' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <circle cx="50" cy="50" r="46" fill="white" stroke="#666" strokeWidth="4" />
                      </svg>
                    )}
                    {item.type === 'drums' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="white" stroke="#666" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                          <rect x="38" y="42" width="24" height="38" />
                          <line x1="38" y1="50" x2="62" y2="50" />
                          <line x1="38" y1="72" x2="62" y2="72" />
                          <line x1="50" y1="42" x2="50" y2="80" />
                          <line x1="42" y1="80" x2="35" y2="95" />
                          <line x1="58" y1="80" x2="65" y2="95" />
                          <rect x="45" y="68" width="10" height="6" />
                          <line x1="50" y1="68" x2="44" y2="58" />
                          <line x1="50" y1="68" x2="56" y2="58" />
                          <circle cx="50" cy="10" r="9" />
                          <rect x="47" y="24" width="6" height="15" rx="2" fill="#666" />
                          <g transform="translate(26, 30) rotate(-15)"><path d="M-14,0 L-14,8 Q0,18 14,8 L14,0 Z" fill="white" /><circle cx="0" cy="0" r="14" fill="white" /></g>
                          <g transform="translate(74, 40) rotate(15)"><path d="M-13,0 L-13,9 Q0,19 13,9 L13,0 Z" fill="white" /><circle cx="0" cy="0" r="13" fill="white" /><line x1="-6" y1="-8" x2="6" y2="8" strokeWidth="2" stroke="#666" /><line x1="-10" y1="-2" x2="2" y2="12" strokeWidth="2" stroke="#666" /></g>
                          <g transform="translate(40, 52) rotate(-20)"><path d="M-11,0 L-11,8 Q0,16 11,8 L11,0 Z" fill="white" /><circle cx="0" cy="0" r="11" fill="white" /></g>
                          <g transform="translate(60, 52) rotate(20)"><path d="M-11,0 L-11,8 Q0,16 11,8 L11,0 Z" fill="white" /><circle cx="0" cy="0" r="11" fill="white" /></g>
                          <g transform="translate(16, 48)"><line x1="-12" y1="-12" x2="0" y2="0" /><line x1="-6" y1="12" x2="0" y2="0" /><circle cx="0" cy="0" r="14" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                          <g transform="translate(28, 74)"><line x1="-8" y1="12" x2="0" y2="0" /><line x1="-12" y1="-6" x2="0" y2="0" /><circle cx="0" cy="0" r="13" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                          <g transform="translate(85, 20)"><path d="M-14,-2 L-26,4 L-24,8 L-14,3 Z" fill="#666" stroke="none" /><circle cx="0" cy="0" r="13" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                          <g transform="translate(80, 66)"><line x1="4" y1="4" x2="14" y2="14" strokeWidth="1.5" /><line x1="14" y1="14" x2="8" y2="28" strokeWidth="1.5" /><line x1="14" y1="14" x2="28" y2="10" strokeWidth="1.5" /><circle cx="0" cy="0" r="13" fill="white" /><circle cx="0" cy="0" r="2" fill="#666" /></g>
                        </g>
                      </svg>
                    )}
                    {item.type === 'mallet' && (
                      <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="white" stroke="#666" strokeWidth="2.5" strokeLinejoin="round">
                          <polygon points="5,35 95,10 95,90 5,65" />
                          {[...Array(28)].map((_, i) => {
                            const ratio = (i + 1) / 29;
                            const x = 5 + 90 * ratio;
                            const topY = 35 - 25 * ratio;
                            const bottomY = 65 + 25 * ratio;
                            return <line key={i} x1={x} y1={topY} x2={x} y2={bottomY} strokeWidth="1.5" stroke="#666" />;
                          })}
                        </g>
                      </svg>
                    )}
                    {item.type === 'cymbals' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                          <polygon points="26,10 10,50 26,90" />
                          <polygon points="34,10 50,50 34,90" />
                          <line x1="26" y1="50" x2="34" y2="50" />
                          <line x1="30" y1="50" x2="30" y2="85" />
                          <line x1="30" y1="85" x2="15" y2="95" />
                          <line x1="30" y1="85" x2="45" y2="95" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'tam_tam' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="20" y1="10" x2="80" y2="10" strokeWidth="3" />
                          <line x1="20" y1="10" x2="10" y2="90" strokeWidth="3" />
                          <line x1="80" y1="10" x2="90" y2="90" strokeWidth="3" />
                          <line x1="20" y1="10" x2="30" y2="28" strokeWidth="1.5" />
                          <line x1="80" y1="10" x2="70" y2="28" strokeWidth="1.5" />
                          <circle cx="50" cy="50" r="35" fill="white" strokeWidth="3" />
                          <circle cx="50" cy="50" r="20" strokeWidth="2" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'tubular_bells' && (
                      <svg viewBox="0 0 100 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2" strokeLinejoin="round">
                          <rect x="15" y="5" width="70" height="90" strokeWidth="2.5" />
                          {[...Array(10)].map((_, i) => {
                            const x = 15 + ((i + 1) * (70/11));
                            const y = 85 - (i * 6);
                            return (
                              <React.Fragment key={i}>
                                <line x1={x} y1="5" x2={x} y2={y} />
                                <line x1={15 + (i * (70/11))} y1={y} x2={x} y2={y} />
                              </React.Fragment>
                            );
                          })}
                          <line x1={15 + (10 * (70/11))} y1={85 - (10 * 6)} x2="85" y2={85 - (10 * 6)} />
                        </g>
                      </svg>
                    )}
                    {item.type === 'bass_drum' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinejoin="round">
                          <line x1="20" y1="80" x2="20" y2="95" />
                          <line x1="40" y1="80" x2="40" y2="95" />
                          <line x1="10" y1="95" x2="50" y2="95" />
                          <path d="M 20 10 L 40 10 A 10 35 0 0 1 40 80 L 20 80" fill="white" />
                          <ellipse cx="20" cy="45" rx="10" ry="35" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'side_drum' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="85" x2="10" y2="95" />
                          <line x1="30" y1="85" x2="50" y2="95" />
                          <line x1="30" y1="85" x2="35" y2="95" />
                          <line x1="30" y1="55" x2="30" y2="85" />
                          <path d="M 10 25 L 10 55 A 20 8 0 0 0 50 55 L 50 25 Z" fill="white" />
                          <ellipse cx="30" cy="25" rx="20" ry="8" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'bongo' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="85" x2="10" y2="95" />
                          <line x1="30" y1="85" x2="50" y2="95" />
                          <line x1="30" y1="85" x2="35" y2="95" />
                          <line x1="30" y1="20" x2="30" y2="85" />
                          <path d="M 2 20 L 6 40 A 10 4 0 0 0 26 40 L 30 20 Z" fill="white" />
                          <ellipse cx="16" cy="20" rx="14" ry="6" fill="white" />
                          <path d="M 30 20 L 34 40 A 10 4 0 0 0 54 40 L 58 20 Z" fill="white" />
                          <ellipse cx="44" cy="20" rx="14" ry="6" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'conga' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="85" x2="10" y2="95" />
                          <line x1="30" y1="85" x2="50" y2="95" />
                          <line x1="30" y1="85" x2="35" y2="95" />
                          <line x1="30" y1="40" x2="30" y2="85" />
                          <path d="M 4 15 Q -2 45 4 75 A 11 4 0 0 0 26 75 Q 32 45 26 15 Z" fill="white" />
                          <ellipse cx="15" cy="15" rx="11" ry="5" fill="white" />
                          <path d="M 34 15 Q 28 45 34 75 A 11 4 0 0 0 56 75 Q 62 45 56 15 Z" fill="white" />
                          <ellipse cx="45" cy="15" rx="11" ry="5" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'concert_toms' && (
                      <svg viewBox="0 0 60 100" className="absolute inset-0 w-full h-full opacity-90">
                        <g fill="none" stroke="#666" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <line x1="30" y1="80" x2="10" y2="95" />
                          <line x1="30" y1="80" x2="50" y2="95" />
                          <line x1="30" y1="80" x2="35" y2="95" />
                          <line x1="30" y1="30" x2="30" y2="80" />
                          <line x1="26" y1="30" x2="34" y2="30" />
                          <path d="M 2 15 L 2 40 A 12 5 0 0 0 26 40 L 26 15 Z" fill="white" />
                          <ellipse cx="14" cy="15" rx="12" ry="5" fill="white" />
                          <path d="M 34 15 L 34 40 A 12 5 0 0 0 58 40 L 58 15 Z" fill="white" />
                          <ellipse cx="46" cy="15" rx="12" ry="5" fill="white" />
                        </g>
                      </svg>
                    )}
                    {item.type === 'other' && (
                      <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full opacity-90">
                        <rect x="2" y="2" width="96" height="96" fill="white" stroke="#666" strokeWidth="4" strokeLinejoin="round" />
                      </svg>
                    )}
                    {item.type === 'text' && (
                      <div className="absolute inset-0 flex items-center justify-center w-full h-full text-center whitespace-pre-wrap leading-tight" style={{ fontSize: `${item.fontSize || 16}px`, color: '#333', fontWeight: 'bold' }}>
                        {item.label}
                      </div>
                    )}

                    {item.type !== 'stand' && item.type !== 'text' && (
                      <div className="absolute inset-0 flex items-center justify-center pointer-events-none p-0.5" style={{ transform: `rotate(${-item.rotation}deg)` }}>
                        {item.type === 'timpani' ? (
                          <span className="text-gray-600 font-bold" style={{ fontSize: `${item.width * 0.3}px` }}>{item.inch}"</span>
                        ) : (
                          <span className="text-gray-800 font-bold text-center leading-tight" style={{ fontSize: (item.type === 'mallet' || item.type === 'other') ? `${Math.max(9, item.height * 0.25)}px` : '9px', maxWidth: (item.type === 'tam_tam' || item.type === 'bass_drum' || item.type === 'side_drum' || item.type === 'bongo' || item.type === 'conga' || item.type === 'concert_toms') ? '65%' : (item.type === 'other' ? '90%' : '100%'), wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{item.label}</span>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </main>

            {/* 右サイドバー: プロパティエディタ */}
            {!isPrinting && (
              <aside className="w-72 bg-white border-l border-gray-200 p-5 flex flex-col gap-6 shrink-0 shadow-sm z-10 overflow-y-auto">
                <div>
                  <h2 className="text-sm font-bold text-gray-500 mb-4 uppercase tracking-wider border-b pb-2">
                    {text.selectedItem}
                  </h2>
                  
                  {selectedIds.length === 1 ? (() => {
                    const selectedItem = items.find((i) => i.id === selectedIds[0]);
                    if (!selectedItem) return null;
                    return (
                      <div className="space-y-4">
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">{text.partName}</label>
                          {selectedItem.type === 'text' ? (
                            <textarea value={selectedItem.label} onChange={(e) => updateSelectedItem('label', e.target.value)} onBlur={commitCurrentItems} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" />
                          ) : (
                            <input type="text" value={selectedItem.label} onChange={(e) => updateSelectedItem('label', e.target.value)} onBlur={commitCurrentItems} className="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                          )}
                        </div>

                        {selectedItem.type === 'text' && (
                          <div className="pt-2 border-t border-gray-100">
                            <h3 className="text-[11px] font-bold text-blue-600 mb-2">{text.fontSize}</h3>
                            <div className="space-y-3 bg-blue-50/50 p-2 rounded border border-blue-100">
                              <div>
                                <div className="flex justify-between text-[10px] text-gray-600 mb-1"><span>{text.fontSize}</span><span>{selectedItem.fontSize || 16}px</span></div>
                                <input type="range" min="10" max="100" step="1" value={selectedItem.fontSize || 16} onChange={(e) => updateSelectedItem('fontSize', parseInt(e.target.value))} onMouseUp={commitCurrentItems} onTouchEnd={commitCurrentItems} className="w-full accent-blue-500" />
                              </div>
                            </div>
                          </div>
                        )}

                        {(selectedItem.type === 'mallet' || selectedItem.type === 'other' || selectedItem.type === 'text') && (
                          <div className="pt-2 border-t border-gray-100">
                            <h3 className="text-[11px] font-bold text-blue-600 mb-2">{selectedItem.type === 'mallet' ? text.sizeAdj : text.sizeAdjOther}</h3>
                            <div className="space-y-3 bg-blue-50/50 p-2 rounded border border-blue-100">
                              <div>
                                <div className="flex justify-between text-[10px] text-gray-600 mb-1"><span>{text.width}</span><span>{pxToCm(selectedItem.width)} cm</span></div>
                                <input type="range" min="20" max="400" step="5" value={pxToCm(selectedItem.width)} onChange={(e) => updateSelectedItem('width', cmToPx(parseInt(e.target.value)))} onMouseUp={commitCurrentItems} onTouchEnd={commitCurrentItems} className="w-full accent-blue-500" />
                              </div>
                              <div>
                                <div className="flex justify-between text-[10px] text-gray-600 mb-1"><span>{text.height}</span><span>{pxToCm(selectedItem.height)} cm</span></div>
                                <input type="range" min="10" max="400" step="5" value={pxToCm(selectedItem.height)} onChange={(e) => updateSelectedItem('height', cmToPx(parseInt(e.target.value)))} onMouseUp={commitCurrentItems} onTouchEnd={commitCurrentItems} className="w-full accent-blue-500" />
                              </div>
                            </div>
                          </div>
                        )}

                        <div>
                          <div className="flex justify-between mb-1"><label className="block text-xs font-bold text-gray-700">{text.rotation} ({text.angle}: {selectedItem.rotation}°)</label></div>
                          <input type="range" min="-180" max="180" step="5" value={selectedItem.rotation} onChange={(e) => updateSelectedItem('rotation', parseInt(e.target.value))} onMouseUp={commitCurrentItems} onTouchEnd={commitCurrentItems} className="w-full" />
                          <div className="flex justify-between text-xs text-gray-400 mt-1"><span>{text.ccw}</span><span>{text.front}</span><span>{text.cw}</span></div>
                          <div className="grid grid-cols-4 gap-1 mt-2">
                            {[-90, 0, 90, 180].map(deg => (
                              <button key={deg} onClick={() => updateSelectedItem('rotation', deg, true)} className="px-1 py-1 bg-gray-100 hover:bg-gray-200 rounded text-[10px] text-gray-600">{deg}°</button>
                            ))}
                          </div>
                        </div>

                        <div className="pt-4 border-t border-gray-100">
                          <button onClick={deleteSelectedItems} className="w-full px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded text-sm font-bold flex items-center justify-center gap-2 transition">
                            <Trash2 className="w-4 h-4" /> {text.deleteItem}
                          </button>
                        </div>
                      </div>
                    );
                  })() : selectedIds.length > 1 ? (
                    <div className="space-y-4">
                      <div className="text-center py-6 bg-blue-50 rounded border border-blue-100">
                        <span className="text-2xl font-bold text-blue-600">{selectedIds.length}</span>
                        <span className="text-sm text-blue-800 ml-1">{text.itemsSelected}</span>
                        <p className="text-xs text-blue-500 mt-1">{text.dragToMove}</p>
                      </div>
                      <div className="pt-4 border-t border-gray-100">
                        <button onClick={deleteSelectedItems} className="w-full px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded text-sm font-bold flex items-center justify-center gap-2 transition">
                          <Trash2 className="w-4 h-4" /> {text.deleteSelected}
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="text-sm text-gray-400 text-center py-10 bg-gray-50 rounded border border-dashed border-gray-200">
                      {text.selectHint.split('\n').map((line, i) => <React.Fragment key={i}>{line}<br/></React.Fragment>)}
                    </div>
                  )}
                </div>
              </aside>
            )}
          </div>
        </div>
      );
    }

    // アプリケーションの描画
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
